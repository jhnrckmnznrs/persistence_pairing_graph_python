name: Python tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: python -m pip install -e '.[images,test]'
      - name: Run regression tests
        run: python -m pytest -q
      - name: Research 3D closure diagnostics (Python 3.12 only)
        if: ${{ matrix.python-version == '3.12' && github.head_ref == 'research/selective-relative-incidence' }}
        run: |
          python benchmarks/investigate_dependency_closure.py --sizes 8 12 16 24 32 --samples 8
          python benchmarks/benchmark_selective_relative.py --sizes 5 7 9
          python benchmarks/benchmark_event_closure_3d.py --sizes 5 7 9
          python benchmarks/benchmark_projection_3d.py --sizes 8 16 24 32
      - name: Sparse old-level cohomology vs full reference (Python 3.12 only)
        if: ${{ matrix.python-version == '3.12' && github.head_ref == 'research/sparse-old-cohomology-oracle' }}
        run: python benchmarks/benchmark_old_cohomology.py --sizes 5 7 9 12 16 --events 2
