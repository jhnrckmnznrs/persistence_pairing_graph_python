[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persistence-pairing-graph"
version = "0.9.0a5"
description = "Python persistence-pairing graphs for cubical filtrations of scalar images"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "John Rick Manzanares"}]
dependencies = ["numpy>=1.24"]
keywords = ["persistent homology", "cubical complex", "TDA", "persistence pairing graph"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Mathematics"]

[project.optional-dependencies]
images = ["tifffile>=2023.1", "Pillow>=10"]
speed = ["numba>=0.60"]
test = ["pytest>=7", "tifffile>=2023.1", "Pillow>=10"]

[project.scripts]
ppg = "persistence_pairing_graph.__main__:main"
ppg-betti = "persistence_pairing_graph._betti_cli:main"
ppg-lift = "persistence_pairing_graph._lift_cli:main"
ppg-explain = "persistence_pairing_graph._edge_geometry_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
